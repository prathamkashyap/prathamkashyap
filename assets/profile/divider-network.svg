<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="100%" height="24" fill="none">
  <defs>
    <!-- userSpaceOnUse required: horizontal &lt;line&gt; has a zero-height bbox -->
    <linearGradient id="netL" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="470" y2="12">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="netR" gradientUnits="userSpaceOnUse" x1="530" y1="12" x2="1000" y2="12">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#818CF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="netGlow" gradientUnits="userSpaceOnUse" cx="500" cy="12" r="15">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-width rails -->
  <line x1="0" y1="12" x2="470" y2="12" stroke="url(#netL)" stroke-width="1.3" stroke-linecap="round" />
  <line x1="530" y1="12" x2="1000" y2="12" stroke="url(#netR)" stroke-width="1.3" stroke-linecap="round" />

  <!-- Constellation edges -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="330" y1="12" x2="392" y2="5" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.75" />
    <line x1="330" y1="12" x2="400" y2="19" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="392" y1="5" x2="452" y2="12" stroke="#67E8F9" stroke-width="1.3" stroke-opacity="0.9" />
    <line x1="400" y1="19" x2="452" y2="12" stroke="#67E8F9" stroke-width="1.3" stroke-opacity="0.8" />
    <line x1="392" y1="5" x2="400" y2="19" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="452" y1="12" x2="478" y2="12" stroke="#67E8F9" stroke-width="1.3" />

    <line x1="548" y1="12" x2="608" y2="5" stroke="#A78BFA" stroke-width="1.3" stroke-opacity="0.9" />
    <line x1="548" y1="12" x2="600" y2="19" stroke="#A78BFA" stroke-width="1.3" stroke-opacity="0.8" />
    <line x1="608" y1="5" x2="670" y2="12" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.75" />
    <line x1="600" y1="19" x2="670" y2="12" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="608" y1="5" x2="600" y2="19" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="522" y1="12" x2="548" y2="12" stroke="#A78BFA" stroke-width="1.3" />
  </g>

  <!-- Outer nodes -->
  <circle cx="330" cy="12" r="3" fill="#0B1020" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="670" cy="12" r="3" fill="#0B1020" stroke="#818CF8" stroke-width="1.5" />

  <!-- Satellite nodes -->
  <circle cx="392" cy="5" r="2.4" fill="#0B1020" stroke="#67E8F9" stroke-width="1.2" />
  <circle cx="400" cy="19" r="2.4" fill="#0B1020" stroke="#38BDF8" stroke-width="1.2" />
  <circle cx="452" cy="12" r="2.4" fill="#0B1020" stroke="#67E8F9" stroke-width="1.2" />
  <circle cx="608" cy="5" r="2.4" fill="#0B1020" stroke="#A78BFA" stroke-width="1.2" />
  <circle cx="600" cy="19" r="2.4" fill="#0B1020" stroke="#C084FC" stroke-width="1.2" />
  <circle cx="548" cy="12" r="2.4" fill="#0B1020" stroke="#A78BFA" stroke-width="1.2" />

  <!-- Central hub -->
  <circle cx="500" cy="12" r="15" fill="url(#netGlow)" />
  <circle cx="500" cy="12" r="5.5" fill="#0B1020" stroke="#67E8F9" stroke-width="1.5" />
  <circle cx="500" cy="12" r="2.2" fill="#A78BFA" />
</svg>