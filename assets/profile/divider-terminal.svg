<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="100%" height="24" fill="none">
  <defs>
    <!-- userSpaceOnUse required: horizontal &lt;line&gt; has a zero-height bbox -->
    <linearGradient id="termL" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="452" y2="12">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="termR" gradientUnits="userSpaceOnUse" x1="548" y1="12" x2="1000" y2="12">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#818CF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full-width rails -->
  <line x1="0" y1="12" x2="452" y2="12" stroke="url(#termL)" stroke-width="1.3" stroke-linecap="round" />
  <line x1="548" y1="12" x2="1000" y2="12" stroke="url(#termR)" stroke-width="1.3" stroke-linecap="round" />

  <!-- Left chevron prompt markers -->
  <path d="M 424 7 L 429 12 L 424 17" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 438 7 L 443 12 L 438 17" stroke="#67E8F9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right chevron prompt markers -->
  <path d="M 576 7 L 571 12 L 576 17" stroke="#A78BFA" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 562 7 L 557 12 L 562 17" stroke="#818CF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Terminal chip badge -->
  <rect x="456" y="2.5" width="88" height="19" rx="4" fill="#0B1020" stroke="#1E293B" stroke-width="1.2" />
  <line x1="461" y1="2.5" x2="539" y2="2.5" stroke="#67E8F9" stroke-width="1" stroke-opacity="0.55" stroke-linecap="round" />

  <!-- Prompt glyph: &gt;_ -->
  <path d="M 470 8 L 475 12 L 470 16" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="479" y1="16" x2="487" y2="16" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round" />

  <!-- Separator + status dot -->
  <text x="499" y="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#475569" font-weight="600">//</text>
  <circle cx="522" cy="12" r="2.4" fill="#A78BFA" />
</svg>