<svg width="1200" height="150" viewBox="0 0 1200 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skill Tree: Systems Forge, Data Alchemy, Vision Craft, Iron Path">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="150">
      <stop offset="0%" stop-color="#140A1F"/>
      <stop offset="100%" stop-color="#090412"/>
    </linearGradient>
    <linearGradient id="conduitLine" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#FF2D4A" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FF2D4A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF2D4A" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="150" fill="#07040C"/>

  <!-- Connecting Energy Conduit Line behind cards -->
  <line x1="20" y1="86" x2="1180" y2="86" stroke="url(#conduitLine)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Card 1: Systems Forge -->
  <g transform="translate(16, 20)">
    <rect width="276" height="110" rx="4" fill="url(#cardBg)" stroke="#391C59" stroke-width="1.5"/>
    <rect width="5" height="110" rx="2" fill="#FF2D4A" filter="url(#glowEffect)"/>
    <text x="20" y="32" fill="#F8EEE9" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" letter-spacing="1">SYSTEMS FORGE</text>
    <text x="210" y="32" fill="#FF8E9A" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">S-RANK</text>
    <text x="20" y="54" fill="#A894BD" font-family="'JetBrains Mono', monospace" font-size="11">gateway · deduplication · resilience</text>
    <!-- Progress Bar -->
    <rect x="20" y="70" width="236" height="8" rx="2" fill="#1B0C28" stroke="#391C59" stroke-width="1"/>
    <rect x="21" y="71" width="210" height="6" rx="1" fill="#FF2D4A" filter="url(#glowEffect)"/>
    <text x="20" y="96" fill="#8E7D9E" font-family="'JetBrains Mono', monospace" font-size="10">MASTERY: 92%</text>
  </g>

  <!-- Card 2: Data Alchemy -->
  <g transform="translate(312, 20)">
    <rect width="276" height="110" rx="4" fill="url(#cardBg)" stroke="#391C59" stroke-width="1.5"/>
    <rect width="5" height="110" rx="2" fill="#FFC857" filter="url(#glowEffect)"/>
    <text x="20" y="32" fill="#F8EEE9" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" letter-spacing="1">DATA ALCHEMY</text>
    <text x="210" y="32" fill="#FFC857" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">A-RANK</text>
    <text x="20" y="54" fill="#A894BD" font-family="'JetBrains Mono', monospace" font-size="11">caching · RRF dense search · DB</text>
    <!-- Progress Bar -->
    <rect x="20" y="70" width="236" height="8" rx="2" fill="#1B0C28" stroke="#391C59" stroke-width="1"/>
    <rect x="21" y="71" width="185" height="6" rx="1" fill="#FFC857"/>
    <text x="20" y="96" fill="#8E7D9E" font-family="'JetBrains Mono', monospace" font-size="10">MASTERY: 82%</text>
  </g>

  <!-- Card 3: Vision Craft -->
  <g transform="translate(608, 20)">
    <rect width="276" height="110" rx="4" fill="url(#cardBg)" stroke="#391C59" stroke-width="1.5"/>
    <rect width="5" height="110" rx="2" fill="#5EB3F0" filter="url(#glowEffect)"/>
    <text x="20" y="32" fill="#F8EEE9" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" letter-spacing="1">VISION CRAFT</text>
    <text x="210" y="32" fill="#5EB3F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">A-RANK</text>
    <text x="20" y="54" fill="#A894BD" font-family="'JetBrains Mono', monospace" font-size="11">YOLOv11 · SAM · OpenCV · Whisper</text>
    <!-- Progress Bar -->
    <rect x="20" y="70" width="236" height="8" rx="2" fill="#1B0C28" stroke="#391C59" stroke-width="1"/>
    <rect x="21" y="71" width="170" height="6" rx="1" fill="#5EB3F0"/>
    <text x="20" y="96" fill="#8E7D9E" font-family="'JetBrains Mono', monospace" font-size="10">MASTERY: 75%</text>
  </g>

  <!-- Card 4: Iron Path -->
  <g transform="translate(904, 20)">
    <rect width="280" height="110" rx="4" fill="url(#cardBg)" stroke="#391C59" stroke-width="1.5"/>
    <rect width="5" height="110" rx="2" fill="#A855F7" filter="url(#glowEffect)"/>
    <text x="20" y="32" fill="#F8EEE9" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" letter-spacing="1">IRON PATH</text>
    <text x="210" y="32" fill="#A855F7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">S-RANK</text>
    <text x="20" y="54" fill="#A894BD" font-family="'JetBrains Mono', monospace" font-size="11">Spring Boot 3.5 · FastAPI · Docker</text>
    <!-- Progress Bar -->
    <rect x="20" y="70" width="240" height="8" rx="2" fill="#1B0C28" stroke="#391C59" stroke-width="1"/>
    <rect x="21" y="71" width="205" height="6" rx="1" fill="#A855F7"/>
    <text x="20" y="96" fill="#8E7D9E" font-family="'JetBrains Mono', monospace" font-size="10">MASTERY: 88%</text>
  </g>
</svg>