<svg width="400" height="144" viewBox="0 0 400 144" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Player Character Plate: Pratham Kashyap - The Systems Forger">
  <defs>
    <linearGradient id="plateBg" x1="0" y1="0" x2="400" y2="144">
      <stop offset="0%" stop-color="#12091F"/>
      <stop offset="60%" stop-color="#0B0514"/>
      <stop offset="100%" stop-color="#180724"/>
    </linearGradient>
    <linearGradient id="redBorder" x1="0" y1="0" x2="400" y2="0">
      <stop offset="0%" stop-color="#FF2D4A"/>
      <stop offset="50%" stop-color="#FF8E9A"/>
      <stop offset="100%" stop-color="#FF2D4A"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFC857" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFC857" stop-opacity="0"/>
    </radialGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel Base -->
  <rect x="1" y="1" width="398" height="142" rx="4" fill="url(#plateBg)" stroke="#391C59" stroke-width="1.5"/>
  <path d="M1 24 L24 1 H376 L399 24 V120 L376 143 H24 L1 120 Z" fill="none" stroke="url(#redBorder)" stroke-width="0.8" opacity="0.6"/>

  <!-- Left Cyber Bar -->
  <rect x="0" y="24" width="5" height="96" fill="#FF2D4A"/>
  <rect x="0" y="44" width="5" height="56" fill="#FFF2F4"/>

  <!-- Kanji Overlay Background -->
  <text x="375" y="45" fill="#FF2D4A" font-family="'Noto Sans JP', 'Hiragino Sans', serif" font-size="28" font-weight="900" opacity="0.07" text-anchor="end">赤月の戦士</text>
  <text x="375" y="85" fill="#FF2D4A" font-family="'Noto Sans JP', 'Hiragino Sans', serif" font-size="28" font-weight="900" opacity="0.07" text-anchor="end">システム鍛冶師</text>

  <!-- Header Category -->
  <text x="24" y="26" fill="#8E7D9E" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" letter-spacing="3">S-RANK HUNTER REGISTRY</text>
  <line x1="24" y1="32" x2="260" y2="32" stroke="#391C59" stroke-width="1"/>

  <!-- Character Name -->
  <text x="24" y="60" fill="#F8EEE9" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" letter-spacing="1">PRATHAM KASHYAP</text>

  <!-- Title / Class -->
  <rect x="24" y="70" width="175" height="20" rx="2" fill="#240D36" stroke="#FF2D4A" stroke-width="1"/>
  <text x="30" y="84" fill="#FF8E9A" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" letter-spacing="1.5">CLASS: SYSTEMS FORGER</text>

  <!-- Location & Level -->
  <text x="24" y="108" fill="#B09EC4" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">PATH: AI &amp; ML · VIT BHOPAL</text>
  
  <!-- XP Bar -->
  <rect x="24" y="118" width="280" height="8" rx="2" fill="#170A26" stroke="#391C59" stroke-width="1"/>
  <rect x="25" y="119" width="220" height="6" rx="1" fill="url(#redBorder)"/>
  <text x="312" y="125" fill="#FF7A8A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">LVL 24</text>

  <!-- Rank S Crest -->
  <g transform="translate(340, 68)">
    <circle cx="0" cy="0" r="28" fill="url(#goldGlow)"/>
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#1C1103" stroke="#FFC857" stroke-width="1.8" filter="url(#badgeGlow)"/>
    <text x="0" y="9" fill="#FFC857" font-family="'Impact', 'Arial Black', sans-serif" font-size="26" font-weight="900" text-anchor="middle" filter="url(#badgeGlow)">S</text>
    <text x="0" y="-28" fill="#FFC857" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" text-anchor="middle" letter-spacing="1">RANK</text>
  </g>

  <!-- Corner Corner Cut Elements -->
  <path d="M4 12V4H12M396 12V4H388M4 132V140H12M396 132V140H388" stroke="#FF2D4A" stroke-width="1.5"/>
</svg>