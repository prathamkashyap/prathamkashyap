<svg width="1200" height="52" viewBox="0 0 1200 52" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Crimson Moon Still Rises - Awaiting the Next Quest">
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#07040C"/>
      <stop offset="50%" stop-color="#140A1F"/>
      <stop offset="100%" stop-color="#07040C"/>
    </linearGradient>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="52" fill="url(#footerBg)"/>
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#2E1748" stroke-width="1"/>
  <line x1="240" y1="0.5" x2="960" y2="0.5" stroke="#FF2D4A" stroke-width="1.5" opacity="0.5"/>

  <!-- Left Archive Tag -->
  <text x="24" y="32" fill="#8E7D9E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">CRIMSON ARCHIVE</text>

  <!-- Center Tagline -->
  <g transform="translate(600, 32)">
    <circle cx="-130" cy="-4" r="3" fill="#FF2D4A"/>
    <text x="0" y="0" fill="#FF8E9A" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="2.5" text-anchor="middle">THE CRIMSON MOON STILL RISES</text>
    <circle cx="130" cy="-4" r="3" fill="#FF2D4A"/>
  </g>

  <!-- Right Online Indicator -->
  <g transform="translate(1000, 32)">
    <circle cx="0" cy="-4" r="4" fill="#4ADE80" filter="url(#greenGlow)"/>
    <text x="14" y="0" fill="#8E7D9E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">AWAITING NEXT QUEST</text>
  </g>
</svg>