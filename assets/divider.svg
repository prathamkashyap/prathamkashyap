<svg width="1200" height="54" viewBox="0 0 1200 54" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="bladeSlash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2D4A" stop-opacity="0"/>
      <stop offset="12%" stop-color="#800D1C"/>
      <stop offset="35%" stop-color="#FF2D4A"/>
      <stop offset="50%" stop-color="#FFF2F4"/>
      <stop offset="65%" stop-color="#FF2D4A"/>
      <stop offset="88%" stop-color="#800D1C"/>
      <stop offset="100%" stop-color="#FF2D4A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowBackdrop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2D4A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF2D4A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF2D4A" stop-opacity="0"/>
    </linearGradient>
    <filter id="bladeAura" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel Base -->
  <rect width="1200" height="54" fill="#07040C"/>

  <!-- Energy Aura -->
  <path d="M60 27 H1140" stroke="url(#glowBackdrop)" stroke-width="14" filter="url(#bladeAura)"/>
  
  <!-- Outer Guide Tracks -->
  <line x1="0" y1="27" x2="430" y2="27" stroke="#32164A" stroke-width="1" stroke-dasharray="8 6"/>
  <line x1="770" y1="27" x2="1200" y2="27" stroke="#32164A" stroke-width="1" stroke-dasharray="8 6"/>

  <!-- Laser Blade Cut -->
  <path d="M0 27 L460 27 L480 16 L510 38 L540 16 L570 38 L600 8 L630 38 L660 16 L690 38 L720 16 L740 27 L1200 27" fill="none" stroke="url(#bladeSlash)" stroke-width="2.2" filter="url(#bladeAura)"/>

  <!-- Center Blood Moon Diamond Crest -->
  <g transform="translate(600, 27)">
    <polygon points="0,-16 16,0 0,16 -16,0" fill="#180B26" stroke="#FF2D4A" stroke-width="1.8"/>
    <polygon points="0,-8 8,0 0,8 -8,0" fill="#FF2D4A" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="#FFF2F4"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#FF8E9A" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Flanking Runes & Embers -->
  <g fill="#FFC857" opacity="0.75">
    <polygon points="510,38 514,42 510,46 506,42" />
    <polygon points="690,38 694,42 690,46 686,42" />
    <circle cx="480" cy="16" r="2" fill="#FF8E9A"/>
    <circle cx="720" cy="16" r="2" fill="#FF8E9A"/>
  </g>

  <!-- Drifting Sakura Sparkles -->
  <circle cx="280" cy="20" r="1.5" fill="#FF8E9A" opacity="0.6"/>
  <circle cx="340" cy="34" r="1.8" fill="#FFC857" opacity="0.4"/>
  <circle cx="410" cy="22" r="1.2" fill="#FF2D4A" opacity="0.7"/>
  <circle cx="790" cy="22" r="1.2" fill="#FF2D4A" opacity="0.7"/>
  <circle cx="860" cy="34" r="1.8" fill="#FFC857" opacity="0.4"/>
  <circle cx="920" cy="20" r="1.5" fill="#FF8E9A" opacity="0.6"/>
  
  <!-- Subtle Crosshairs -->
  <path d="M200 24v6M197 27h6M1000 24v6M997 27h6" stroke="#FF2D4A" stroke-width="1" opacity="0.4"/>
</svg>